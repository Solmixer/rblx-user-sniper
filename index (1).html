<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roblox Username Checker</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080c13;color:#f3f7fc;font-family:Segoe UI,Arial,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:28px 30px}
header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
h1{margin:0;font-size:28px}
.sub{color:#8390a5;margin-top:4px;font-size:13px}
.status{background:#131d2b;color:#27e47b;border-radius:999px;padding:9px 15px;font-weight:700;font-size:12px}
.card{background:#0f1724;border:1px solid #1c2a3c;border-radius:24px;padding:18px;margin:10px 0}
.settings{display:grid;grid-template-columns:120px 120px 1fr auto;gap:14px;align-items:end}
label{font-size:12px;font-weight:700;display:block;margin-bottom:7px}
select,button{height:42px;border-radius:12px;border:1px solid #26364b;background:#0b121d;color:#f3f7fc;padding:0 12px;font-weight:700}
button{cursor:pointer;border:0;padding:0 20px}
.start{background:#27e47b;color:#06120b}
.stop{background:#ff5871;color:white}
.download{background:#131d2b;color:#f3f7fc;margin-top:12px}
.toggle{display:flex;align-items:center;gap:10px;height:42px}
.toggle input{width:18px;height:18px;accent-color:#27e47b}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{padding:15px 18px}
.stat small{color:#8390a5;font-weight:700}
.stat b{display:block;font-size:24px;margin-top:3px}
.blue{color:#5ba9ff}.green{color:#27e47b}.red{color:#ff5871}
.log{height:430px;overflow:auto;background:#070b11;border-radius:17px;padding:15px;font:13px Consolas,monospace;white-space:pre-wrap}
.available{color:#27e47b}.taken{color:#78869a}.error{color:#ff5871}.rate{color:#f6cf67}.info{color:#5ba9ff}
@media(max-width:800px){
.settings{grid-template-columns:1fr 1fr}
.toggle{grid-column:1/-1}
.actions{grid-column:1/-1}
header{gap:10px;flex-direction:column}
}
</style>
</head>
<body>
<div class="wrap">

<header>
<div>
<h1>Roblox Username Checker</h1>
<div class="sub">Simple • Fast • Live username validation</div>
</div>
<div id="status" class="status">● READY</div>
</header>

<div class="card settings">

<div>
<label>Length</label>
<select id="length">
<option>3</option>
<option selected>4</option>
<option>5</option>
</select>
</div>

<div>
<label>Threads</label>
<select id="threads">
<option>1</option>
<option>2</option>
<option selected>3</option>
</select>
</div>

<div>
<label>Options</label>
<div class="toggle">
<input id="numbers" type="checkbox" checked>
<span>Include Numbers</span>
</div>
</div>

<div class="actions">
<button class="start" id="start">START SCAN</button>
<button class="stop" id="stop">STOP</button>
</div>

</div>

<div class="stats">
<div class="card stat">
<small>● CHECKED</small>
<b id="checked" class="blue">0</b>
</div>

<div class="card stat">
<small>● AVAILABLE</small>
<b id="available" class="green">0</b>
</div>

<div class="card stat">
<small>● ERRORS</small>
<b id="errors" class="red">0</b>
</div>
</div>

<div class="card">

<div style="font-weight:700;margin-bottom:9px">
LIVE RESULTS
</div>

<div id="log" class="log"></div>

<button class="download" id="download">
DOWNLOAD AVAILABLE
</button>

</div>

</div>

<script>
const INTERVAL = 100;
const COOLDOWN = 15000;

let running = false;
let stopped = false;
let nextSlot = 0;
let pauseUntil = 0;

let checked = 0;
let available = 0;
let errors = 0;

let iterator = null;
let availableNames = [];

const $ = id => document.getElementById(id);

function log(message, type = "info") {
    const element = document.createElement("div");
    element.className = type;
    element.textContent = message;

    $("log").appendChild(element);
    $("log").scrollTop = $("log").scrollHeight;
}

function status(message, type = "info") {
    $("status").textContent = "● " + message.toUpperCase();

    if (type === "error") {
        $("status").style.color = "#ff5871";
    } else if (type === "rate") {
        $("status").style.color = "#f6cf67";
    } else if (type === "ok") {
        $("status").style.color = "#27e47b";
    } else {
        $("status").style.color = "#5ba9ff";
    }
}

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function waitForSlot() {
    while (running && !stopped) {
        const now = Date.now();

        if (
            now >= pauseUntil &&
            now >= nextSlot
        ) {
            nextSlot = now + INTERVAL;
            return true;
        }

        await sleep(
            Math.min(
                50,
                Math.max(
                    10,
                    Math.max(pauseUntil, nextSlot) - now
                )
            )
        );
    }

    return false;
}

function* generate(chars, length) {
    const count = chars.length;
    const indexes = new Array(length).fill(0);

    while (!stopped) {
        yield indexes.map(i => chars[i]).join("");

        let position = length - 1;

        while (
            position >= 0 &&
            indexes[position] === count - 1
        ) {
            indexes[position] = 0;
            position--;
        }

        if (position < 0) {
            return;
        }

        indexes[position]++;
    }
}

// ================================================================
// SERVERLESS BACKEND URL
//
// Replace this with the HTTPS URL of your deployed serverless backend.
// Your backend should expose:
//   GET /api/test
//   GET /api/check?username=...
//
// Example:
// const API_BASE = "https://your-backend.example.com";
// ================================================================
const API_BASE = "https://YOUR-BACKEND-URL-HERE";

function apiUrl(path) {
    return API_BASE.replace(/\/$/, "") + path;
}

async function testServer() {
    try {
        if (API_BASE.includes("YOUR-BACKEND-URL-HERE")) {
            throw new Error(
                "Set API_BASE near the bottom of index.html to your deployed HTTPS serverless backend URL."
            );
        }

        const response = await fetch(
            apiUrl("/api/test"),
            {
                cache: "no-store",
                mode: "cors"
            }
        );

        const text = await response.text();
        const contentType = response.headers.get("content-type") || "unknown";

        let data;
        try {
            data = JSON.parse(text);
        } catch {
            throw new Error(
                "The page is not being served by server.py. HTTP " +
                response.status +
                ", Content-Type: " +
                contentType +
                ". Response starts with: " +
                text.slice(0, 120).replace(/\s+/g, " ")
            );
        }

        if (!response.ok || !data.ok) {
            throw new Error(
                data.error || "Local server could not reach Roblox."
            );
        }

        log(
            "Connection test OK - Roblox HTTP " +
            data.status
        );

        return true;

    } catch (error) {
        log(
            "CONNECTION TEST FAILED: " +
            (error.message || error),
            "error"
        );

        status("Connection failed", "error");

        return false;
    }
}

async function check(username) {
    if (!(await waitForSlot())) {
        return;
    }

    try {
        const response = await fetch(
            apiUrl("/api/check?username=" +
            encodeURIComponent(username)),
            {
                cache: "no-store",
                mode: "cors"
            }
        );

        /*
         * Always read the body as text first.
         * This gives us useful diagnostics even if a proxy/server
         * accidentally sends HTML instead of JSON.
         */
        const text = await response.text();

        let data;

        try {
            data = JSON.parse(text);
        } catch {
            throw new Error(
                "Server returned non-JSON HTTP " +
                response.status +
                ": " +
                text.slice(0, 160)
            );
        }

        if (data.rateLimited) {
            pauseUntil = Math.max(
                pauseUntil,
                Date.now() + COOLDOWN
            );

            status(
                "Rate limited - waiting 15s",
                "rate"
            );

            log(
                username +
                " - HTTP 429. Pausing all requests for 15 seconds.",
                "rate"
            );

            await sleep(COOLDOWN);
            return;
        }

        if (!response.ok || !data.ok) {
            throw new Error(
                data.error ||
                ("HTTP " + response.status)
            );
        }

        if (data.status === "AVAILABLE") {
            available++;

            $("available").textContent =
                available.toLocaleString();

            availableNames.push(username);

            log(
                username + " - AVAILABLE",
                "available"
            );

        } else if (data.status === "TAKEN") {
            log(
                username + " - TAKEN",
                "taken"
            );

        } else {
            errors++;

            $("errors").textContent =
                errors.toLocaleString();

            log(
                username +
                " - UNAVAILABLE (" +
                (data.message || "unknown response") +
                ")",
                "error"
            );
        }

    } catch (error) {
        errors++;

        $("errors").textContent =
            errors.toLocaleString();

        log(
            username +
            " - " +
            (error.message || error),
            "error"
        );

    } finally {
        checked++;

        $("checked").textContent =
            checked.toLocaleString();
    }
}

async function worker() {
    while (running && !stopped) {
        const item = iterator.next();

        if (item.done) {
            return;
        }

        await check(item.value);
    }
}

async function start() {
    if (running) {
        return;
    }

    const connected = await testServer();

    if (!connected) {
        return;
    }

    checked = 0;
    available = 0;
    errors = 0;
    availableNames = [];

    $("checked").textContent = "0";
    $("available").textContent = "0";
    $("errors").textContent = "0";
    $("log").textContent = "";

    stopped = false;
    running = true;

    nextSlot = 0;
    pauseUntil = 0;

    const length = Number(
        $("length").value
    );

    const workers = Math.min(
        3,
        Number($("threads").value)
    );

    let chars = "abcdefghijklmnopqrstuvwxyz";

    if ($("numbers").checked) {
        chars += "0123456789";
    }

    iterator = generate(chars, length);

    const total =
        chars.length ** length;

    log(
        "Starting " +
        length +
        "-character scan: " +
        total.toLocaleString() +
        " possible combinations."
    );

    log(
        "Using " +
        workers +
        " workers. Browser → local server → Roblox."
    );

    status("Scanning", "ok");

    await Promise.all(
        Array.from(
            {length: workers},
            worker
        )
    );

    if (!stopped) {
        running = false;
        status("Finished", "ok");
        log("Scan finished.");
    }
}

function stop() {
    if (!running) {
        return;
    }

    stopped = true;
    running = false;

    status("Stopped", "error");
    log("Scan stopped.", "error");
}

$("start").onclick = start;
$("stop").onclick = stop;

$("download").onclick = () => {
    const blob = new Blob(
        [
            availableNames.join("\n") +
            (availableNames.length ? "\n" : "")
        ],
        {
            type: "text/plain"
        }
    );

    const link =
        document.createElement("a");

    link.href =
        URL.createObjectURL(blob);

    link.download =
        "Usernames.txt";

    link.click();

    setTimeout(
        () => URL.revokeObjectURL(link.href),
        1000
    );
};
</script>
</body>
</html>
